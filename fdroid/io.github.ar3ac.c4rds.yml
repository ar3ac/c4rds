AutoName: C4rds
Summary: Offline loyalty card & barcode wallet
Description: |-
  A native, ultra-fast, and 100% offline-first Android application to manage your
  loyalty cards and barcodes (supermarkets, retail stores, gyms, memberships).

  Features:
  * 100% Open-Source ZXing & CameraX Barcode/QR Scanner
  * Scan barcodes from camera or import from gallery photos
  * Full offline-first design: cards stay strictly on your device
  * High-resolution barcode and QR code rendering
  * Automatic temporary peak screen brightness for retail self-checkouts
  * Pinned launcher shortcuts with store logos
  * Fast JSON backup and restore (.c4rds)
  * Native English and Italian internationalization (i18n)

