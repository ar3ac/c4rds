<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>c4rds — Le tue tessere fedeltà</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0A1628;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #132238;
            border-radius: 20px;
            padding: 40px 32px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .logo {
            background: #0A3D6B;
            color: white;
            font-weight: 900;
            font-size: 28px;
            width: 80px;
            height: 80px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }
        h1 { font-size: 28px; margin-bottom: 12px; }
        .subtitle { color: #8899AA; font-size: 16px; margin-bottom: 28px; line-height: 1.5; }
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            background: #0A3D6B;
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn:hover { background: #0D4F8B; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">c4</div>
        <h1>c4rds</h1>
        <p class="subtitle">Tutte le tue tessere fedeltà in un'app.<br>Semplice. Veloce. Offline.</p>
        <a class="btn" href="https://github.com/ar3ac/c4rds/releases">Scarica l'app</a>
    </div>
</body>
</html>
